services:
  # Recorded responses from the Eberron wiki's API and Keith Baker's blog, so
  # tests never depend on the live sites. See wiki_mock/mock_wiki.py.
  wiki-mock:
    image: python:3.12-slim
    container_name: wiki-mock
    command: ["python", "/mock/mock_wiki.py"]
    volumes:
      - ./wiki_mock:/mock:ro
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health\", timeout=2)' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15

  mcp-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mcp-server
    depends_on:
      wiki-mock:
        condition: service_healthy
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"localhost\", 8000), timeout=2)' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      - PYTHONUNBUFFERED=1
      - EBERRON_WIKI_BASE_URL=http://wiki-mock:8080
      - KEITH_BAKER_BLOG_BASE_URL=http://wiki-mock:8080

  test:
    build:
      context: ..
      dockerfile: tests/Dockerfile
    container_name: test-runner
    depends_on:
      mcp-server:
        condition: service_healthy
    command: pytest --mcp-tools=http://mcp-server:8000 tests/
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
